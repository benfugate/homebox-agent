name: Build and Push Docker Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: homebox-agent:test
          platforms: linux/amd64
          cache-from: type=gha,scope=latest
          cache-to: type=gha,mode=max,scope=latest

      - name: Offline tests inside the image
        run: |
          docker run --rm --entrypoint /opt/homebox-agent/.venv/bin/python \
            -v "$PWD/tests:/tests:ro" -e PYTHONPATH=/opt/homebox-agent \
            homebox-agent:test /tests/test_offline.py

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.title=homebox-agent
            org.opencontainers.image.description=Discord inventory agent for Homebox, built on claude-hermes-container
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=latest
          cache-to: type=gha,mode=max,scope=latest
